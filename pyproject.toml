[project]
name = "xian-contracts-hub"
version = "0.1.0"
description = "Curated contract hub for Xian"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "xian-tech-accounts>=0.1.0,<1",
    "xian-tech-contracting[v2,zk]>=1.1.4,<2",
    "xian-tech-linter[vm]>=0.4.3,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.15.12,<0.16",
]

[tool.uv.sources]
xian-tech-accounts = { path = "../xian-contracting/packages/xian-accounts", editable = true }
xian-tech-contracting = { path = "../xian-contracting", editable = true }
xian-tech-linter = { path = "../xian-linter", editable = true }

[tool.pytest.ini_options]
testpaths = ["contracts", "tests"]
python_files = ["test_*.py"]
addopts = "-m \"not slow\""
markers = [
    "slow: proof-generation and end-to-end proving flows",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["contracts/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
